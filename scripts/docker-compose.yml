version: "3"
services:
  nexus-oss:
    image: "${NEXUS_IMAGE}:${NEXUS_VERSION}-${NEXUS_IMAGE_OS}"
    user: "${UID}:${GID}"
    ports:
      - "${NEXUS_PORT}:8081"
    volumes:
      - "${PWD}/oss-nexus.properties:/nexus-data/etc/nexus.properties:ro"
    profiles:
      - oss
  nexus-pro:
    image: "${NEXUS_IMAGE}:${NEXUS_VERSION}-${NEXUS_IMAGE_OS}"
    user: "${UID}:${GID}"
    ports:
      - "${NEXUS_PORT}:8081"
    volumes:
      - "${PWD}/pro-nexus.properties:/nexus-data/etc/nexus.properties:ro"
      - "${PWD}/license.lic:/nexus-data/etc/license.lic:ro"
    profiles:
      - pro
  minio:
    # renovate: datasource=docker depName=cgr.dev/chainguard/minio
    image: "cgr.dev/chainguard/minio:latest@sha256:3c60a2a8c4d33409a9bc7a623a7fcbfb4605adc3d89422d2f53b3f673a6e5597"
    ports:
      - "9000:9000"
    command: "server --address :9000 /data"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
